# CodeRabbit AI 리뷰 설정. BOAZ 서비스운영팀 backend 설정을 CardSync(Python·FastAPI·LLM 파이프라인)에 맞게 고쳤다.
# 스키마: https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"
tone_instructions: "짧고 구체적으로. 문제와 고치는 방법을 함께 쓰고, 칭찬 문장은 생략하세요."
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false # 사람 리뷰만 머지 여부를 정한다
  high_level_summary: true
  high_level_summary_instructions: |
    아래 형식으로 요약하세요.
    - 변경 목적: 1~2문장
    - 주요 변경: 영역(ai / data_pipeline / backend / renderer / frontend / experiments) 기준 목록
    - 영향: 스키마(data_pipeline/schemas) 변경, API 응답 변경, 프롬프트 변경, OpenAI 호출 횟수·모델 변경 여부
  review_status: true
  collapse_walkthrough: true
  assess_linked_issues: true
  related_issues: false
  related_prs: false
  poem: false
  sequence_diagrams: false
  changed_files_summary: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches: ["dev"] # 기본 브랜치(main) 외에 dev 대상 PR도 리뷰한다

  path_filters:
    - "!data/samples/**" # 기사 원문(저작권, 리뷰 대상 아님)
    - "!data/outputs/**"
    - "!experiments/**/results/**"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!renderer/assets/**"

  path_instructions:
    - path: "**"
      instructions: |
        3인 캡스톤 팀의 코드입니다. 리뷰 피로를 줄이기 위해 다음 기준을 지키세요.
        1. 라인 코멘트는 버그, 보안(키·원문 노출), 계약(스키마·API) 위반, 테스트 누락에만 남기세요.
        2. 스타일·네이밍·사소한 개선은 라인 코멘트 대신 요약 한 곳에 모으세요. ruff가 포맷과 린트를 이미 검사합니다.
        3. 지적마다 문제, 근거가 되는 코드 위치, 고치는 방법을 쓰세요. 필요하면 짧은 예시 코드를 붙이세요.
    - path: "ai/**/*.py"
      instructions: |
        LLM을 부르는 코드입니다. 다음을 우선 확인하세요.
        - 모델 응답을 Pydantic 스키마로 검증하는지, 검증 실패 시 재시도·실패 처리가 있는지
        - 예외 메시지와 로그에 원문 문장이나 API 키가 들어가지 않는지
        - 원문에 없는 숫자·고유명사를 만들어 낼 여지가 있는 프롬프트 변경인지
        - 호출 횟수나 모델이 바뀌면 비용 영향이 PR 설명에 있는지
    - path: "data_pipeline/schemas/**"
      instructions: |
        팀 공용 계약입니다. 필드 이름·타입 변경은 ai/, backend/의 사용처가 함께 바뀌었는지 확인하고, 하위 호환이 깨지면 명시적으로 지적하세요.
    - path: "backend/**/*.py"
      instructions: |
        FastAPI 백엔드입니다. 응답은 {code, message, data} 형식이고 오류 응답에는 data가 없습니다.
        - 상태 전이(카드 version 증가 시 이전 판정 만료)가 깨지지 않는지
        - 오래 걸리는 요청이 202 + job_id 방식을 지키는지
        - 로그에 원문·요청 본문·키가 남지 않는지
        - ai/, data_pipeline/ 코드를 직접 고치지 않고 연결부(services/pipeline.py)에서만 변환하는지
    - path: "tests/**"
      instructions: |
        테스트는 OPENAI_API_KEY 없이 돌아야 합니다(CI에 키가 없음). 실제 API를 부르는 테스트가 있으면 지적하세요.
    - path: "experiments/**"
      instructions: |
        평가 실험 설정입니다. 실행하지 않은 결과를 결과처럼 적거나, fixture 결과를 성능 수치로 표기한 부분이 있으면 지적하세요.

  tools:
    ruff:
      enabled: true
    gitleaks:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  learnings:
    scope: local
