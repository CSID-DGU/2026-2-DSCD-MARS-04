name: Auto Assign & Label

on:
  pull_request_target:
    types: [opened, reopened, edited]
  issues:
    types: [opened, reopened, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  assign-and-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const members = { yooncandooit: '윤지', krlyeon: '수연', SeojunJang: '서준' };
            const typeLabels = {
              init: '🎉 Init',
              feat: '⭐️ Feat',
              fix: '🐛 Fix',
              docs: '✏️ Docs',
              refactor: '🛠️ Refactor',
              chore: '🧹 Chore',
              test: '🔎 Test',
              style: '🧁 Style',
              deploy: '🚀 Deploy',
            };
            const types = Object.keys(typeLabels);

            const isPR = Boolean(context.payload.pull_request);
            const item = isPR ? context.payload.pull_request : context.payload.issue;
            const author = item.user.login;
            const params = { ...context.repo, issue_number: item.number };

            if (context.payload.action !== 'edited' && !item.assignees.some((a) => a.login === author)) {
              await github.rest.issues.addAssignees({ ...params, assignees: [author] });
            }

            let type = null;
            if (isPR) {
              const m = item.title.match(/^\[(\w+)\] /);
              if (m && types.includes(m[1].toLowerCase())) type = m[1].toLowerCase();
            } else if (/^\[Feat\]/.test(item.title)) {
              type = 'feat';
            } else if (/^\[Fix\]/.test(item.title)) {
              type = 'fix';
            } else if (/^\[Task\]/.test(item.title)) {
              const m = (item.body || '').match(/### 작업 유형\s+(\w+)/);
              if (m && types.includes(m[1])) type = m[1];
            }

            const typeLabel = type ? typeLabels[type] : null;
            const current = item.labels.map((l) => l.name);
            for (const name of current) {
              if (Object.values(typeLabels).includes(name) && name !== typeLabel) {
                await github.rest.issues.removeLabel({ ...params, name });
              }
            }

            const labels = [members[author], typeLabel].filter((n) => n && !current.includes(n));
            if (labels.length) {
              await github.rest.issues.addLabels({ ...params, labels });
            }
