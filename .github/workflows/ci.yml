name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      promptfoo: ${{ steps.filter.outputs.promptfoo }}
      has_package_json: ${{ steps.pkg.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
              - 'requirements.txt'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            promptfoo:
              - 'experiments/promptfoo/**'
              - 'ai/verification/consistency/numbers.py'
              - '.github/workflows/ci.yml'
      - id: pkg
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt ruff pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest || [ $? -eq 5 ]

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.has_package_json == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build

  promptfoo-smoke:
    needs: changes
    if: needs.changes.outputs.promptfoo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
          cache-dependency-path: experiments/promptfoo/package-lock.json
      - working-directory: experiments/promptfoo
        run: npm ci
      # API 키 없이 fixture만 실행한다. 유료 모델 호출 없음.
      - working-directory: experiments/promptfoo
        env:
          PROMPTFOO_PYTHON: python
        run: npm run smoke

  commit-msg:
    if: github.event_name == 'pull_request' && github.base_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > msg.txt
            sh .github/scripts/check-commit-msg.sh msg.txt || failed=1
          done
          exit $failed

  gitleaks:
    runs-on: ubuntu-latest
    env:
      # 버전과 체크섬을 함께 고정한다(gitleaks_<버전>_checksums.txt의 linux_x64 값). 올릴 때 둘 다 바꾼다
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action은 조직 저장소에서 라이선스 키를 요구해서 바이너리를 직접 받아 실행한다
      - name: gitleaks 설치
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: 저장소 이력 전체 비밀값 검사
        run: ./gitleaks git --redact --no-banner -v .

  ci-result:
    if: always()
    needs: [changes, python, frontend, promptfoo-smoke, commit-msg, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "CI passed"
