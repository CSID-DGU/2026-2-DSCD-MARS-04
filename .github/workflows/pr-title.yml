name: PR Title

on:
  pull_request:
    branches: [main, dev]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: sh .github/scripts/check-pr-title.sh "$TITLE"
