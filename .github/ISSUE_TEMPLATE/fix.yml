name: Fix
description: 버그나 동작 오류를 수정합니다
title: "[Fix] "
labels: ["🐛 Fix"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 작업 영역
      options:
        - frontend
        - backend
        - data_pipeline
        - ai
        - renderer
        - 기타
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 현상
      description: 어떤 문제가 발생했는지 적어주세요
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 로그 / 스크린샷
      render: shell
