name: Task
description: 문서, 리팩터링, 설정, 테스트 등 기능 외 작업을 등록합니다
title: "[Task] "
body:
  - type: dropdown
    id: type
    attributes:
      label: 작업 유형
      options:
        - docs
        - refactor
        - chore
        - test
        - style
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 작업 영역
      options:
        - frontend
        - backend
        - data_pipeline
        - ai
        - renderer
        - 기타
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
